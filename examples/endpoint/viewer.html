<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rewindbug reports</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: #8884;
        --muted: #888;
        --error: #d33;
      }
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        margin: 0 auto;
        padding: 24px 16px;
        max-width: 1100px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 16px;
        margin: 24px 0 8px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      select,
      button {
        font: inherit;
        padding: 4px 8px;
        max-width: 100%;
      }
      .stage {
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .stage > div {
        transform-origin: 0 0;
      }
      pre {
        border: 1px solid var(--line);
        padding: 12px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
      }
      .muted {
        color: var(--muted);
      }
      .error {
        color: var(--error);
        white-space: pre-wrap;
        word-break: break-word;
      }
      code {
        word-break: break-all;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>rewindbug reports</h1>
    <p id="empty" hidden>
      No reports yet. Point the SDK at this server's <code>/report</code> URL,
      with the write token in the path if the server has one.
    </p>
    <div id="report" hidden>
      <div class="row">
        <label
          >Report
          <select id="pick"></select
        ></label>
        <label
          >Speed
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select></label
        >
        <button id="again" type="button">From start</button>
      </div>
      <p id="headline" class="error"></p>
      <p id="issue" hidden>
        <a id="issue-link" href="#" rel="noopener">GitHub issue</a>
      </p>
      <div id="stage" class="stage"></div>
      <p id="no-replay" class="muted" hidden></p>
      <h2>Steps</h2>
      <pre id="steps"></pre>
      <h2>Playwright test</h2>
      <pre id="test"></pre>
      <h2>Error</h2>
      <pre id="stack"></pre>
      <h2>Console</h2>
      <pre id="console"></pre>
      <h2>Network</h2>
      <pre id="network"></pre>
      <h2>Context</h2>
      <pre id="context"></pre>
    </div>
    <script type="module">
      // the player comes from the CDN in the version that recorded the
      // report: @rrweb/record and @rrweb/replay are released together
      const CDN = "https://cdn.jsdelivr.net/npm/@rrweb/replay@";
      const FALLBACK_VERSION = "2.1.7";
      const VERSION = /^\d+\.\d+\.\d+$/;
      const base = location.pathname;
      const byId = (id) => document.getElementById(id);
      const text = (id, value) => (byId(id).textContent = value);
      const lines = (items) => (items.length ? items.join("\n") : "none");
      const loaded = new Map();
      let player = null;
      let events = [];

      const playerFor = async (version) => {
        const v = VERSION.test(version) ? version : FALLBACK_VERSION;
        if (!loaded.has(v)) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = `${CDN}${v}/dist/style.css`;
          document.head.append(link);
          loaded.set(v, import(`${CDN}${v}/dist/replay.js`));
        }
        try {
          return (await loaded.get(v)).Replayer;
        } catch (error) {
          // the next report tries the CDN again
          loaded.delete(v);
          throw error;
        }
      };

      const play = async (Replayer) => {
        player?.destroy();
        const stage = byId("stage");
        const box = document.createElement("div");
        stage.replaceChildren(box);
        player = new Replayer(events, {
          root: box,
          mouseTail: false,
          showWarning: false,
          speed: Number(byId("speed").value),
        });
        player.on("resize", ({ width, height }) => {
          const scale = Math.min(1, stage.clientWidth / width);
          box.style.transform = `scale(${scale})`;
          stage.style.height = `${Math.ceil(height * scale)}px`;
        });
        player.play();
      };

      const pathOf = (url) => {
        try {
          const u = new URL(url);
          return u.pathname + u.search;
        } catch {
          return url;
        }
      };

      const noRecording = (why) => {
        player?.destroy();
        player = null;
        events = [];
        byId("stage").hidden = true;
        const noReplay = byId("no-replay");
        noReplay.hidden = false;
        noReplay.textContent = why;
      };

      // the server checks only the fields it needs: the rest may be missing
      const show = async (report) => {
        const c = report.context ?? {};
        const limits = report.limits ?? {};
        const sdk = report.sdk ?? {};
        text("headline", `${report.trigger.kind}: ${report.trigger.message}`);
        text("steps", report.stepsMarkdown || "none");
        text("test", report.test);
        text("stack", report.trigger.error?.stack ?? report.trigger.message);
        text(
          "console",
          lines(report.console.map((e) => `${e.level}: ${e.message}`)),
        );
        // bodies are in the report only for urls in bodyAllowlist
        text(
          "network",
          lines(
            report.network.map((e) =>
              [
                `${e.method} ${pathOf(e.url)} ${e.status ?? e.error ?? "pending"}${e.durationMs === undefined ? "" : ` (${e.durationMs} ms)`}`,
                e.requestBody === undefined ? "" : `  sent: ${e.requestBody}`,
                e.responseBody === undefined
                  ? ""
                  : `  received: ${e.responseBody}`,
              ]
                .filter(Boolean)
                .join("\n"),
            ),
          ),
        );
        text(
          "context",
          lines([
            `url: ${c.url}`,
            `title: ${c.title}`,
            `when: ${new Date(report.createdAt).toISOString()}`,
            ...(c.viewport
              ? [
                  `viewport: ${c.viewport.width}×${c.viewport.height} @${c.viewport.dpr}`,
                ]
              : []),
            `language: ${c.language}, timezone: ${c.timezone}`,
            `browser: ${c.userAgent}`,
            ...(c.app?.release ? [`release: ${c.app.release}`] : []),
            ...(c.app?.environment
              ? [`environment: ${c.app.environment}`]
              : []),
            ...Object.entries(c.tags ?? {}).map(([k, v]) => `tag ${k}: ${v}`),
            ...(limits.truncated?.length
              ? [`truncated: ${limits.truncated.join(", ")}`]
              : []),
            `sdk: rewindbug ${sdk.version}, rrweb ${sdk.rrwebVersion}`,
          ]),
        );
        if (!report.replay?.events?.length) {
          noRecording(`No recording: ${limits.replayState ?? "off"}`);
          return;
        }
        let Replayer;
        try {
          Replayer = await playerFor(sdk.rrwebVersion);
        } catch {
          noRecording(
            "The player did not load from cdn.jsdelivr.net: this page needs internet access to play recordings.",
          );
          return;
        }
        byId("no-replay").hidden = true;
        byId("stage").hidden = false;
        events = report.replay.events;
        await play(Replayer);
      };

      const load = async (name) => {
        const response = await fetch(`${base}/${name}.json`);
        if (!response.ok) {
          text("headline", `Report ${name} is gone (${response.status})`);
          return;
        }
        history.replaceState(null, "", `#${name}`);
        const issue = byId("issue");
        const item = list.find((s) => s.name === name);
        // only a GitHub web link, never a javascript: or data: url
        const href = /^https:\/\//.test(item?.issue ?? "") ? item.issue : "";
        issue.hidden = !href;
        if (href) byId("issue-link").href = href;
        await show(await response.json());
      };

      const label = (s) =>
        [
          new Date(s.receivedAt).toLocaleString(),
          s.kind,
          s.message.length > 60 ? `${s.message.slice(0, 60)}…` : s.message,
          `${s.stepsCount} steps`,
          ...(s.automated ? ["automated"] : []),
        ].join(" · ");

      const list = await (await fetch(`${base}/list`)).json();
      if (list.length === 0) {
        byId("empty").hidden = false;
      } else {
        byId("report").hidden = false;
        const pick = byId("pick");
        pick.replaceChildren(
          ...list.map((s) =>
            Object.assign(document.createElement("option"), {
              value: s.name,
              textContent: label(s),
            }),
          ),
        );
        pick.onchange = () => void load(pick.value);
        byId("speed").onchange = () =>
          player?.setConfig({ speed: Number(byId("speed").value) });
        byId("again").onclick = () => player?.play(0);
        const wanted = location.hash.slice(1);
        const first = list.find((s) => s.name === wanted) ?? list[0];
        pick.value = first.name;
        await load(first.name);
      }
    </script>
  </body>
</html>
