<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bench: heavy form</title>
    <script type="module" src="/__variant.js"></script>
  </head>
  <body>
    <form id="f"></form>
    <p id="summary"></p>
    <script type="module">
      const FIELD_COUNT = 60;
      const MIN_LENGTH = 3;
      const TYPES = [
        "text",
        "email",
        "tel",
        "number",
        "password",
        "textarea",
        "select",
      ];
      const form = document.getElementById("f");
      for (let i = 0; i < FIELD_COUNT; i++) {
        const type = TYPES[i % TYPES.length];
        const wrap = document.createElement("div");
        const label = document.createElement("label");
        label.htmlFor = `f${i}`;
        label.textContent = `Field ${i}`;
        let field;
        if (type === "textarea") {
          field = document.createElement("textarea");
        } else if (type === "select") {
          field = document.createElement("select");
          field.innerHTML = ["a", "b", "c"]
            .map((v) => `<option value="${v}">${v}</option>`)
            .join("");
        } else {
          field = document.createElement("input");
          field.type = type;
        }
        field.id = `f${i}`;
        field.className = "field";
        const error = document.createElement("span");
        error.className = "error";
        wrap.append(label, field, error);
        form.append(wrap);
      }
      const summary = document.getElementById("summary");
      form.addEventListener("input", (e) => {
        const error = e.target.nextElementSibling;
        const tooShort = String(e.target.value).length < MIN_LENGTH;
        error.textContent = tooShort ? "Too short" : "";
        e.target.setAttribute("aria-invalid", String(tooShort));
        const invalid = form.querySelectorAll("[aria-invalid=true]").length;
        summary.textContent = `${invalid} invalid fields`;
      });
    </script>
  </body>
</html>
