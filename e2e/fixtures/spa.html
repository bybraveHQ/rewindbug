<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Router</title>
  <label>Search <input id="q" /></label>
  <button id="open">Open order</button>
  <main id="view"></main>
  <script type="module">
    import { init } from "/rewindbug.browser.js";
    window.started = init({
      endpoint: `${location.origin}/report${location.search}`,
    });
    const ROUTE_DELAY_MS = 1200;
    document.getElementById("q").addEventListener("input", (event) => {
      history.replaceState(
        {},
        "",
        `?q=${encodeURIComponent(event.target.value)}`,
      );
    });
    document.getElementById("open").addEventListener("click", () => {
      // the router moves after a slow API call, not on the click itself
      setTimeout(() => {
        history.pushState({}, "", "?view=order");
        const pay = document.createElement("button");
        pay.textContent = "Pay";
        pay.addEventListener("click", () => {
          throw new Error("pay broke");
        });
        document.getElementById("view").replaceChildren(pay);
      }, ROUTE_DELAY_MS);
    });
  </script>
</html>
